name: Vérification de la base de données

on:
  push:

jobs:
  db:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : récupérer le code du dépôt
      - name: Récupération du code
        uses: actions/checkout@v4

      # Étape 2 : préparer PostgreSQL
      - name: Préparation de la base de données
        run: bash db/setup.sh

      # Étape 3 : afficher les étudiants
      - name: Afficher les étudiants
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tp -c "SELECT * FROM students;"